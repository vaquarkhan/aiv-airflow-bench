          use-uv: ${{ inputs.use-uv }}
          # We do not want to clean up /mnt here - it's been already done before preparing image
          make-mnt-writeable-and-cleanup: false
      # Keep failures in an existing test check and avoid another runner/image restore.
      # Matrix exclusions describe Python/backend combinations, not individual test shards.
      - name: >
          Migration Tests: ${{ matrix.python-version }}:${{ env.PARALLEL_TEST_TYPES }}
        uses: ./.github/actions/migration_tests
        with:
          python-version: ${{ matrix.python-version }}
        # Keep the existing unsupported-Python exemption until a compatible release is available.
        if: >-
          inputs.run-migration-tests == 'true' && inputs.test-group == 'core' &&
          matrix.python-version != '3.14' &&
          matrix.test-types.description == fromJSON(inputs.test-types-as-strings-in-json)[0].description
      - name: >
          ${{ inputs.test-group }}:${{ inputs.test-scope }} Tests ${{ inputs.test-name }} ${{ matrix.backend-version }}
          Py${{ matrix.python-version }}:${{ env.PARALLEL_TEST_TYPES }}
