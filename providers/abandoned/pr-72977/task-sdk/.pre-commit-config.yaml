        pass_filenames: false
        files: ^.*\.py$
        require_serial: true
  - repo: https://github.com/boidolr/ast-grep-pre-commit
    rev: 0.45.2
    hooks:
      - id: ast-grep
        name: Check task-sdk imports httpx2 rather than httpx
        types: [python]
        # Pinned to the task-sdk config rather than relying on ast-grep walking up
