  using: "composite"
  steps:
    - name: "Restore CI docker images ${{ inputs.platform }}:${{ inputs.python }}"
      uses: apache/infrastructure-actions/stash/restore@49df447b39b18354895520e0a63731b7cad7cbec
      with:
        key: ci-image-save-v3-${{ inputs.platform }}-${{ inputs.python }}
        path: "/mnt/"
